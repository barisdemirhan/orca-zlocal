name: build
run-name: build ${{ inputs.ref }}

# Builds one commit of the personal Orca dist branch. Nothing here signs, publishes or holds a secret:
# the Mac that dispatched the run downloads the outputs, checks their attestations, then packages,
# signs and notarizes locally.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA of the dist branch to build
        required: true
        type: string
      base:
        description: Full commit SHA of the upstream release the dist branch sits on
        required: true
        type: string
      only:
        description: Run every job (all) or only the Linux package (linux-deb)
        required: false
        default: all
        type: choice
        options: [all, linux-deb]

permissions: {}

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  vet:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vet inputs
        env:
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full commit SHA"; exit 1; }
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base must be a full commit SHA"; exit 1; }

  typecheck:
    needs: vet
    if: inputs.only != 'linux-deb'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tc

  # Reports only: the feature branches carry lint debt that is cleaned before their PRs, so it must
  # not hold back the personal build. The job still shows red with its findings.
  lint:
    needs: vet
    if: inputs.only != 'linux-deb'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The changed-code-quality step diffs against the upstream release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move the comparison script out of the tree
        run: mv ci-tools/.github/scripts/compare-with-base.sh "$RUNNER_TEMP/" && rm -rf ci-tools
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      # Type-aware lint runs twice when a step fails (here and on the release); a lost runner left no log.
      - name: Add swap
        run: sudo fallocate -l 8G /swap-extra && sudo chmod 600 /swap-extra && sudo mkswap -q /swap-extra && sudo swapon /swap-extra
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile install --frozen-lockfile
      - name: Lint, failing only on findings the upstream release does not have
        env:
          ORCA_CODE_QUALITY_BASE: ${{ inputs.base }}
          BASE: ${{ inputs.base }}
        run: |
          set -o pipefail
          if pnpm lint --maxWorkers=1 --timings 2>&1 | tee "$RUNNER_TEMP/lint.log"; then exit 0; fi
          "$RUNNER_TEMP/compare-with-base.sh" lint "$RUNNER_TEMP/lint.log"

  test:
    needs: vet
    if: inputs.only != 'linux-deb'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The cross-version wire tests check out older releases by tag; give them full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream release tags
        run: git fetch --quiet --no-recurse-submodules https://github.com/stablyai/orca.git 'refs/tags/v*:refs/tags/v*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tools
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move the comparison script out of the tree
        run: mv ci-tools/.github/scripts/compare-with-base.sh "$RUNNER_TEMP/" && rm -rf ci-tools
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node config/scripts/electron-installation/platform-layout/install-electron-package-binary.mjs
      - name: Test shard ${{ matrix.shard }}/4
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
          SHARD: ${{ matrix.shard }}
          BASE: ${{ inputs.base }}
        run: |
          set -o pipefail
          node config/scripts/workspace-package-build/build-workspace-packages.mjs
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=node
          if node config/scripts/test-runtime/execution-policy/run-vitest.mjs run --config config/vitest.config.ts \
            --shard="$SHARD/4" --maxWorkers=4 2>&1 | tee "$RUNNER_TEMP/vitest.log"; then exit 0; fi
          "$RUNNER_TEMP/compare-with-base.sh" tests "$RUNNER_TEMP/vitest.log"

  javascript:
    needs: vet
    if: inputs.only != 'linux-deb'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile install --frozen-lockfile
      # Our branches add ~3 KB of shared code to the phone page; upstream sits at its own fence. Our build only.
      - name: Widen the mobile web bundle fence
        run: |
          f=config/scripts/build/mobile-web-app/verify-mobile-web-app-bundle.mjs
          sed -i 's/^export const MOBILE_WEB_APP_BUNDLE_MAX_TOTAL_BYTES = 10\.75 \* 1024 \* 1024$/export const MOBILE_WEB_APP_BUNDLE_MAX_TOTAL_BYTES = 10.8 * 1024 * 1024/' "$f"
          grep -qx 'export const MOBILE_WEB_APP_BUNDLE_MAX_TOTAL_BYTES = 10.8 \* 1024 \* 1024' "$f"
      # The same step list as build:desktop minus its typecheck, which the typecheck job runs.
      - run: pnpm run build:desktop:assets
      - name: Pack out/
        env:
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ]
          mkdir -p ci-out
          tar -czf ci-out/orca-javascript.tar.gz out
          printf '{"kind":"javascript","source":"%s","sha256":"%s"}\n' "$REF" \
            "$(sha256sum ci-out/orca-javascript.tar.gz | cut -d' ' -f1)" > ci-out/orca-javascript.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ci-out/orca-javascript.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-javascript
          path: ci-out/
          retention-days: 1
          if-no-files-found: error

  mac-helpers:
    needs: vet
    if: inputs.only != 'linux-deb'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: node config/scripts/native-build/macos/build-computer-macos.mjs
      - run: node config/scripts/native-build/macos/build-keyboard-layout-macos.mjs
      - run: node config/scripts/native-build/macos/build-process-footprint-macos.mjs
      - run: node config/scripts/native-build/macos/build-notification-status-macos.mjs
      - name: Pack the helper products
        env:
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ]
          mkdir -p ci-out
          tar -czf ci-out/orca-mac-helpers.tar.gz \
            "native/computer-use-macos/.build/release/Orca Computer Use.app" \
            native/computer-use-macos/.build/release/orca-computer-use-macos \
            native/notification-status-macos/.build/release/orca-notification-status \
            native/keyboard-layout-macos/.build/release/orca-keyboard-layout \
            native/process-footprint-macos/.build/release/orca-process-footprint
          printf '{"kind":"mac-helpers","source":"%s","sha256":"%s"}\n' "$REF" \
            "$(shasum -a 256 ci-out/orca-mac-helpers.tar.gz | cut -d' ' -f1)" > ci-out/orca-mac-helpers.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ci-out/orca-mac-helpers.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-mac-helpers
          path: ci-out/
          retention-days: 1
          if-no-files-found: error

  # The deb pd installs with dpkg and cb unpacks to /opt/Orca. Unsigned: dpkg needs no signature, and
  # the Mac checks this attestation before relaying the file.
  linux-deb:
    needs: vet
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install rpm for electron-builder's fpm backend
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mobile install --frozen-lockfile
      # Built on its own first: inside the packaging run its X11 test failed on the old build host.
      - run: node config/scripts/native-build/linux/build-wayland-clipboard.mjs --arch x64
      # Our branches add ~3 KB of shared code to the phone page; upstream sits at its own fence. Our build only.
      - name: Widen the mobile web bundle fence
        run: |
          f=config/scripts/build/mobile-web-app/verify-mobile-web-app-bundle.mjs
          sed -i 's/^export const MOBILE_WEB_APP_BUNDLE_MAX_TOTAL_BYTES = 10\.75 \* 1024 \* 1024$/export const MOBILE_WEB_APP_BUNDLE_MAX_TOTAL_BYTES = 10.8 * 1024 * 1024/' "$f"
          grep -qx 'export const MOBILE_WEB_APP_BUNDLE_MAX_TOTAL_BYTES = 10.8 \* 1024 \* 1024' "$f"
      - run: pnpm run build:desktop:assets
      - run: pnpm run ensure:electron-runtime
      - name: Package the deb
        env:
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ]
          base=$(node -p 'const [a,b,c]=require("./package.json").version.split(".");[a,b,Number(c)+1].join(".")')
          version="$base-zlocal.$(date +%s).${REF:0:12}"
          pnpm exec electron-builder --config config/electron-builder.config.cjs --linux deb --x64 \
            -c.extraMetadata.version="$version" --publish never
          mkdir -p ci-out
          mv dist/orca-ide_*_amd64.deb ci-out/orca-linux-deb.deb
          printf '{"kind":"linux-deb","source":"%s","version":"%s","sha256":"%s"}\n' "$REF" "$version" \
            "$(sha256sum ci-out/orca-linux-deb.deb | cut -d' ' -f1)" > ci-out/orca-linux-deb.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ci-out/orca-linux-deb.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-linux-deb
          path: ci-out/
          retention-days: 1
          if-no-files-found: error
